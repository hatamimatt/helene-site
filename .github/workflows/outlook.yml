# Refreshes the globe's past five days from the newest GFS analysis and publishes the site to
# GitHub Pages. GFS 1 degree files for a cycle are complete about 4 hours after it (00, 06, 12, 18 UTC).
name: Update globe data

on:
  schedule:
    - cron: "30 4,10,16,22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # decoded GFS times from earlier runs, so each run downloads only the newest one
      - uses: actions/cache@v4
        with:
          path: .cache/recent
          key: gfs-recent-${{ github.run_id }}
          restore-keys: gfs-recent-

      - run: python update.py

      - name: Assemble site
        run: |
          mkdir _site
          cp *.html _site/
          cp -r data articles assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
